<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acceder - Ace Sport Club</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 flex flex-col min-h-screen text-slate-900 justify-between">

    <header class="bg-[#1e3a5f] text-white py-4 px-6 border-b border-[#0f1f33]">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2.5">
                <img src="assets/logo.png" alt="Ace Sport Club" class="h-9 bg-white rounded-full p-1">
                <span class="font-bold text-base tracking-tight">Ace Sport Club</span>
            </a>
            <a href="app.html" class="text-xs text-slate-200 hover:text-white">Abrir App</a>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="w-full max-w-md club-card p-8 bg-white">
            <div class="text-center mb-6">
                <h1 class="text-xl font-extrabold text-[#1e3a5f] tracking-tight">Acceso a Mi Cuenta</h1>
                <p class="text-slate-500 text-xs mt-1">Introduce tus credenciales del club</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="tu@email.com" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-[#1e3a5f] outline-none text-xs">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Contraseña</label>
                    <input type="password" id="password" required placeholder="Tu contraseña" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-[#1e3a5f] outline-none text-xs">
                </div>

                <div id="errorMsg" class="text-rose-700 text-xs hidden font-medium text-center">Credenciales incorrectas.</div>

                <button type="submit" id="submitBtn" class="w-full bg-[#1e3a5f] hover:bg-[#152840] text-white font-bold py-3 px-4 rounded-xl transition text-xs shadow-sm">
                    Entrar a la App
                </button>
            </form>

            <div class="mt-6 text-center border-t border-slate-100 pt-5 space-y-2">
                <p class="text-slate-500 text-xs">¿No tienes cuenta aún?</p>
                <a href="join.html" class="inline-block font-bold text-emerald-700 hover:text-emerald-800 text-xs">Inscribirse / Elegir Plan</a>
                <div>
                    <a href="app.html" class="inline-block text-[11px] text-slate-400 hover:text-slate-600">Explorar la App como invitado</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-400 py-4 text-center text-xs border-t border-slate-800">
        <p>&copy; 2026 Ace Sport Club. Pallejà.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (await checkAuth()) {
                window.location.replace('app.html');
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');

            btn.disabled = true;
            errorMsg.classList.add('hidden');

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                errorMsg.textContent = error.message.includes('Invalid') ? 'Email o contraseña incorrectos.' : error.message;
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
            } else {
                window.location.replace('app.html');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción Interactiva - Ace Sport Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans flex flex-col min-h-screen">
    <header class="bg-white shadow-sm py-4 sticky top-0 z-50">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2">
                <img src="assets/logo.png" alt="Ace Sport Club" class="h-10">
                <span class="font-bold text-xl text-[#1e3a5f]">Ace Sport Club</span>
            </a>
            <a href="index.html" class="text-gray-500 hover:text-[#1e3a5f] font-medium"><i class="fas fa-times"></i> Cancelar</a>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-3xl">
        <div class="bg-white rounded-2xl shadow-lg p-6 md:p-10 border border-gray-100">
            <h1 class="text-3xl font-bold text-[#1e3a5f] mb-2 text-center">Únete al Club</h1>
            <p class="text-center text-gray-500 mb-8">Completa tu registro en 3 sencillos pasos.</p>

            <form id="joinForm" class="space-y-8">
                <!-- STEP 1: Datos Personales -->
                <div class="step-section">
                    <h2 class="text-xl font-semibold mb-4 border-b pb-2"><i class="fas fa-user-circle text-blue-500 mr-2"></i> 1. Datos Personales</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo</label>
                            <input type="text" required class="w-full rounded-lg border-gray-300 border p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">NIF / DNI</label>
                            <input type="text" required class="w-full rounded-lg border-gray-300 border p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Email (Usuario)</label>
                            <input type="email" id="emailInput" required class="w-full rounded-lg border-gray-300 border p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                            <input type="password" id="passwordInput" required class="w-full rounded-lg border-gray-300 border p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                </div>

                <!-- STEP 2: Selección de Abono -->
                <div class="step-section">
                    <h2 class="text-xl font-semibold mb-4 border-b pb-2"><i class="fas fa-id-card text-green-500 mr-2"></i> 2. Elige tu Tarifa</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <label class="border rounded-xl p-4 cursor-pointer hover:border-green-500 focus-within:ring-2 ring-green-500 transition relative">
                            <input type="radio" name="membership" value="adulto" class="absolute top-4 right-4 h-5 w-5 text-green-600" checked>
                            <div class="font-bold text-lg mb-1">Abonado Adulto</div>
                            <div class="text-2xl font-black text-[#1e3a5f] mb-1">60€<span class="text-sm font-normal text-gray-500">/mes</span></div>
                            <p class="text-sm text-gray-500">Acceso completo. + Matrícula (120€).</p>
                        </label>
                        <label class="border rounded-xl p-4 cursor-pointer hover:border-green-500 focus-within:ring-2 ring-green-500 transition relative">
                            <input type="radio" name="membership" value="padel" class="absolute top-4 right-4 h-5 w-5 text-green-600">
                            <div class="font-bold text-lg mb-1">Abonado Pádel</div>
                            <div class="text-2xl font-black text-[#1e3a5f] mb-1">56€<span class="text-sm font-normal text-gray-500">/mes</span></div>
                            <p class="text-sm text-gray-500">Acceso pádel. + Matrícula (112€).</p>
                        </label>
                        <label class="border rounded-xl p-4 cursor-pointer hover:border-green-500 focus-within:ring-2 ring-green-500 transition relative">
                            <input type="radio" name="membership" value="gym" class="absolute top-4 right-4 h-5 w-5 text-green-600">
                            <div class="font-bold text-lg mb-1">Abonado Gym</div>
                            <div class="text-2xl font-black text-[#1e3a5f] mb-1">39€<span class="text-sm font-normal text-gray-500">/mes</span></div>
                            <p class="text-sm text-gray-500">Acceso gimnasio. + Matrícula (78€).</p>
                        </label>
                        <label class="border rounded-xl p-4 cursor-pointer hover:border-green-500 focus-within:ring-2 ring-green-500 transition relative">
                            <input type="radio" name="membership" value="gym_clases" class="absolute top-4 right-4 h-5 w-5 text-green-600">
                            <div class="font-bold text-lg mb-1">Gym + Clases Ilimitadas</div>
                            <div class="text-2xl font-black text-[#1e3a5f] mb-1">60€<span class="text-sm font-normal text-gray-500">/mes</span></div>
                            <p class="text-sm text-gray-500">Gimnasio y clases. + Matrícula (120€).</p>
                        </label>
                        <label class="border rounded-xl p-4 cursor-pointer hover:border-green-500 focus-within:ring-2 ring-green-500 transition relative">
                            <input type="radio" name="membership" value="clases_2horas" class="absolute top-4 right-4 h-5 w-5 text-green-600">
                            <div class="font-bold text-lg mb-1">Clases Dirigidas 2h/sem</div>
                            <div class="text-2xl font-black text-[#1e3a5f] mb-1">35€<span class="text-sm font-normal text-gray-500">/mes</span></div>
                            <p class="text-sm text-gray-500">2h clases semanales. + Matrícula (70€).</p>
                        </label>
                        <label class="border rounded-xl p-4 cursor-pointer hover:border-green-500 focus-within:ring-2 ring-green-500 transition relative">
                            <input type="radio" name="membership" value="clases_ilimitado" class="absolute top-4 right-4 h-5 w-5 text-green-600">
                            <div class="font-bold text-lg mb-1">Clases Dirigidas Ilimitado</div>
                            <div class="text-2xl font-black text-[#1e3a5f] mb-1">45€<span class="text-sm font-normal text-gray-500">/mes</span></div>
                            <p class="text-sm text-gray-500">Clases ilimitadas. + Matrícula (90€).</p>
                        </label>
                        <label class="border rounded-xl p-4 cursor-pointer hover:border-green-500 focus-within:ring-2 ring-green-500 transition relative sm:col-span-2">
                            <input type="radio" name="membership" value="completo_dirigidas_ilimitadas" class="absolute top-4 right-4 h-5 w-5 text-green-600">
                            <div class="font-bold text-lg mb-1">Abonado Completo + Dirigidas Ilimitadas</div>
                            <div class="text-2xl font-black text-[#1e3a5f] mb-1">85€<span class="text-sm font-normal text-gray-500">/mes</span></div>
                            <p class="text-sm text-gray-500">Todo incluido. + Matrícula (170€).</p>
                        </label>
                    </div>
                </div>

                <!-- STEP 3: Normativas y Protección de Datos -->
                <div class="step-section">
                    <h2 class="text-xl font-semibold mb-4 border-b pb-2"><i class="fas fa-file-contract text-orange-500 mr-2"></i> 3. Políticas y Privacidad</h2>
                    <div class="space-y-4">
                        <label class="flex items-start gap-3 p-3 bg-gray-50 rounded-lg border">
                            <input type="checkbox" required class="mt-1 h-5 w-5 text-blue-600">
                            <span class="text-sm text-gray-600">He leído y acepto la <a href="#" class="text-blue-600 underline">normativa de uso de las instalaciones</a> y confirmo que me comprometo a respetarla. Entiendo que la matrícula inicial equivale a 2 mensualidades.</span>
                        </label>
                        <label class="flex items-start gap-3 p-3 bg-gray-50 rounded-lg border">
                            <input type="checkbox" required class="mt-1 h-5 w-5 text-blue-600">
                            <span class="text-sm text-gray-600">Autorizo el tratamiento de mis datos personales según la normativa de Protección de Datos vigente para la correcta prestación del servicio.</span>
                        </label>
                        <label class="flex items-start gap-3 p-3 bg-gray-50 rounded-lg border">
                            <input type="checkbox" class="mt-1 h-5 w-5 text-blue-600">
                            <span class="text-sm text-gray-600">Consiento el tratamiento de mi imagen (fotos/vídeos realizados por la entidad) para publicarlas en redes sociales y publicidad. (Opcional)</span>
                        </label>
                    </div>
                </div>

                <!-- Submit -->
                <div class="pt-4 border-t text-center">
                    <button type="submit" id="checkoutBtn" class="w-full md:w-auto px-10 py-4 bg-[#22c55e] hover:bg-green-600 text-white font-bold text-lg rounded-full transition shadow-lg flex items-center justify-center mx-auto gap-2">
                        <i class="fas fa-lock"></i> Ir al Pago Seguro (Stripe)
                    </button>
                    <p class="text-xs text-gray-400 mt-3"><i class="fab fa-stripe text-xl align-middle mr-1"></i> Pagos encriptados y seguros.</p>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Supabase will be configured here via Vercel env later
        
        document.getElementById('joinForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('checkoutBtn');
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Procesando...';
            btn.disabled = true;

            // In a real flow, you create the Supabase user auth first, 
            // then send their UID to the Stripe session creator.
            
            try {
                // Mock API call to our Vercel serverless function
                const response = await fetch('/api/create-checkout-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        membership: document.querySelector('input[name="membership"]:checked').value,
                        email: document.getElementById('emailInput').value,
                        userId: "temp-user-id" // Replace with real Supabase Auth ID in production
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    if(data.url) {
                        window.location.href = data.url; // Redirect to Stripe Checkout
                    }
                } else {
                    alert('Por favor, configura Stripe en Vercel para continuar.');
                    btn.innerHTML = '<i class="fas fa-lock"></i> Ir al Pago Seguro (Stripe)';
                    btn.disabled = false;
                }
            } catch (error) {
                console.error(error);
                alert('No se pudo conectar con el servidor. Asegúrate de ejecutar esto en Vercel.');
                btn.innerHTML = '<i class="fas fa-lock"></i> Ir al Pago Seguro (Stripe)';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
